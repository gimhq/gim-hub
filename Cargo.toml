[workspace]
resolver = "2"
members = [
    "crates/gim-hub-identity",
    "crates/gim-hub-proto",
    "crates/gim-hub-db",
    "crates/gim-hub-api",
    "crates/gim-hub-s2s",
    "crates/gim-hub-push",
    "crates/gim-hub",
    "crates/gim-push-mock",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
publish = false
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

[workspace.dependencies]
gim-hub-identity = { path = "crates/gim-hub-identity" }
gim-hub-proto = { path = "crates/gim-hub-proto" }
gim-hub-db = { path = "crates/gim-hub-db" }
gim-hub-api = { path = "crates/gim-hub-api" }
gim-hub-s2s = { path = "crates/gim-hub-s2s" }
gim-hub-push = { path = "crates/gim-hub-push" }

axum = { version = "=0.8.9", default-features = false, features = [
    "http1",
    "json",
    "macros",
    "query",
    "tokio",
    "ws",
] }
base64 = "=0.23.1"
ciborium = "=0.2.2"
data-encoding = "=2.11.1"
ed25519-dalek = "=2.2.0"
futures-util = "=0.3.34"
async-trait = "=0.1.92"
futures = "=0.3.34"
getrandom = "=0.4.3"
hex = "=0.4.3"
# Federation transport; only `gim-hub-s2s::transport` imports it.
libp2p = { version = "=0.56.0", default-features = false, features = [
    "dns",
    "kad",
    "macros",
    "noise",
    "ping",
    "pnet",
    "quic",
    "request-response",
    "tcp",
    "tokio",
    "yamux",
] }
http-body-util = "=0.1.5"
# Test-only HTTP client of the compose federation driver.
hyper = { version = "=1.12.0", default-features = false }
hyper-util = { version = "=0.1.21", default-features = false }
openmls = "=0.9.1"
openmls_basic_credential = "=0.6.0"
openmls_rust_crypto = "=0.6.0"
openmls_traits = "=0.6.0"
prost = "=0.14.4"
prost-build = "=0.14.4"
# Pure-Rust protobuf compiler: no `protoc` binary needed at build time.
protox = "=0.10.0"
rand = "=0.10.3"
# Push webhook HTTP client; rustls with ring, no OpenSSL.
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls"] }
# Push webhook HMAC-SHA256 signatures and delivery ids.
ring = "=0.17.14"
rusqlite = { version = "=0.37.0", features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.10.9"
tempfile = "=3.27.0"
thiserror = "=2.0.21"
tls_codec = "=0.5.0"
tokio = "=1.53.3"
tokio-stream = "=0.1.19"
tokio-tungstenite = { version = "=0.29.0", default-features = false, features = ["connect"] }
tower = { version = "=0.5.3", default-features = false, features = ["util"] }
tower-http = { version = "=0.6.11", features = ["limit", "trace"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "fmt"] }
utoipa = { version = "=6.0.0", features = ["axum_extras"] }
