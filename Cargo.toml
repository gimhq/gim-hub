[workspace]
resolver = "2"
members = [
    "crates/gim-hub-identity",
    "crates/gim-hub-proto",
    "crates/gim-hub-db",
    "crates/gim-hub-api",
    "crates/gim-hub-s2s",
    "crates/gim-hub",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
publish = false
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

[workspace.dependencies]
gim-hub-identity = { path = "crates/gim-hub-identity" }
gim-hub-proto = { path = "crates/gim-hub-proto" }
gim-hub-db = { path = "crates/gim-hub-db" }
gim-hub-api = { path = "crates/gim-hub-api" }
gim-hub-s2s = { path = "crates/gim-hub-s2s" }

axum = { version = "=0.8.9", default-features = false, features = [
    "http1",
    "json",
    "macros",
    "query",
    "tokio",
    "ws",
] }
base64 = "=0.23.1"
bs58 = "=0.5.1"
data-encoding = "=2.11.1"
ed25519-dalek = "=3.0.0"
hex = "=0.4.3"
prost = "=0.14.4"
prost-build = "=0.14.4"
# Pure-Rust protobuf compiler: no `protoc` binary needed at build time.
protox = "=0.10.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"
thiserror = "=2.0.21"
tokio = "=1.53.3"
tower = { version = "=0.5.3", default-features = false, features = ["util"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "fmt"] }
utoipa = { version = "=6.0.0", features = ["axum_extras"] }
