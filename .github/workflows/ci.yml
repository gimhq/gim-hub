name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  # Same version as the oven/bun image of scripts/admin-ui.sh and the Dockerfile.
  BUN_VERSION: "1.4.3"

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      # Same gates as scripts/admin-ui.sh check. The build (admin-ui/dist) must
      # exist before cargo: gim-hub-admin embeds it and fails to compile without it.
      - name: Admin UI
        working-directory: admin-ui
        run: bun install --frozen-lockfile && bun run lint && bun run typecheck && bun run test && bun run build
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image and smoke test
        run: bash scripts/docker-smoke.sh

  federation:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      # The compose driver compiles gim-hub, which embeds admin-ui/dist; the
      # hub images build their own UI in the Dockerfile.
      - name: Build the admin UI
        working-directory: admin-ui
        run: bun install --frozen-lockfile && bun run build
      - name: 3-hub compose acceptance
        env:
          GIM_FED_CARGO_HOME: ${{ runner.temp }}/cargo
          GIM_FED_TIMEOUT: "900"
        run: bash scripts/fed-test.sh
      - name: Multi-homing compose acceptance
        env:
          GIM_FED_CARGO_HOME: ${{ runner.temp }}/cargo
          GIM_FED_TIMEOUT: "900"
          GIM_FED_SUITE: mh
          GIM_FED_SKIP_BUILD: "1"
        run: bash scripts/fed-test.sh
