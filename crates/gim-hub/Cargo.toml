[package]
name = "gim-hub"
description = "gim hub server binary"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
axum = { workspace = true }
gim-hub-api = { workspace = true }
gim-hub-db = { workspace = true }
gim-hub-s2s = { workspace = true }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
gim-hub-api = { workspace = true, features = ["testing"] }
serde_json = { workspace = true }
tempfile = { workspace = true }
tower = { workspace = true }
