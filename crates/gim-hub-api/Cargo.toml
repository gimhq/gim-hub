[package]
name = "gim-hub-api"
description = "Client HTTP/WebSocket API v2 for the gim hub"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
# Test helpers (`gim_hub_api::testing`); enabled only through dev-dependencies.
testing = ["dep:tempfile"]

[dependencies]
axum = { workspace = true }
base64 = { workspace = true }
ed25519-dalek = { workspace = true }
futures-util = { workspace = true }
getrandom = { workspace = true }
gim-hub-db = { workspace = true }
gim-hub-identity = { workspace = true }
hex = { workspace = true }
openmls = { workspace = true }
openmls_rust_crypto = { workspace = true }
rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tempfile = { workspace = true, optional = true }
thiserror = { workspace = true }
tls_codec = { workspace = true }
tokio = { workspace = true, features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
utoipa = { workspace = true }

[dev-dependencies]
gim-hub-api = { workspace = true, features = ["testing"] }
http-body-util = { workspace = true }
openmls_basic_credential = { workspace = true }
openmls_traits = { workspace = true }
tempfile = { workspace = true }
tokio-tungstenite = { workspace = true }
tower = { workspace = true }
