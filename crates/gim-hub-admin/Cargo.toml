[package]
name = "gim-hub-admin"
description = "Admin API of the gim hub, served on a separate listener"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
axum = { workspace = true }
base64 = { workspace = true }
getrandom = { workspace = true }
gim-hub-api = { workspace = true }
gim-hub-db = { workspace = true }
gim-hub-identity = { workspace = true }
gim-hub-s2s = { workspace = true }
hex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["fs", "rt", "sync"] }
tracing = { workspace = true }
utoipa = { workspace = true }

[dev-dependencies]
ed25519-dalek = { workspace = true }
gim-hub-api = { workspace = true, features = ["testing"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tower = { workspace = true }
